version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sanchay-postgres
    restart: always
    environment:
      POSTGRES_USER: sanchay_user
      POSTGRES_PASSWORD: sanchay_password
      POSTGRES_DB: sanchay_db
    ports:
      - "5432:5432"
    volumes:
      - sanchay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanchay_user -d sanchay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sanchay-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - sanchay_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sanchay_pgdata:
    driver: local
  sanchay_redisdata:
    driver: local
